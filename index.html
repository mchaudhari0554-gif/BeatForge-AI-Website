<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BeatForge AI - Song Generator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#080810;
  color:white;
}
header{
  padding:22px;
  text-align:center;
  background:#0d0d18;
  border-bottom:1px solid #222;
}
.logo{
  font-size:28px;
  font-weight:bold;
  color:#9b5cff;
}
.subtitle{
  color:#aaa;
  margin-top:6px;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#11111d;
  border:1px solid #252535;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}
label{
  display:block;
  color:#bbb;
  margin:12px 0 7px;
}
input,select,textarea{
  width:100%;
  background:#080810;
  color:white;
  border:1px solid #333348;
  border-radius:10px;
  padding:13px;
  outline:none;
}
textarea{
  min-height:110px;
  resize:vertical;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.lyricsBtn{
  background:#7c3cff;
  color:white;
}
.songBtn{
  background:#27273a;
  color:white;
}
button:disabled{
  opacity:.5;
}
#status{
  margin-top:15px;
  color:#ffb3b3;
  white-space:pre-wrap;
}
audio{
  width:100%;
  margin-top:15px;
}
.lyrics{
  background:#080810;
  padding:15px;
  border-radius:12px;
  line-height:1.7;
  white-space:pre-wrap;
}
.small{
  color:#888;
  font-size:13px;
  margin-top:7px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎵 BeatForge AI</div>
  <div class="subtitle">AI Song Generator</div>
</header>

<div class="container">

<div class="card">

<label>Song Idea</label>
<textarea id="prompt"
placeholder="Example: A romantic Hindi love song about two people who miss each other..."></textarea>

<label>Language</label>
<select id="language">
  <option>Hindi</option>
  <option>Gujarati</option>
  <option>Punjabi</option>
  <option>English</option>
</select>

<label>Genre</label>
<select id="genre">
  <option>Pop</option>
  <option>Hip Hop</option>
  <option>Lo-fi</option>
  <option>Rock</option>
  <option>Romantic</option>
  <option>Motivational</option>
  <option>Electronic</option>
</select>

<label>Mood</label>
<select id="mood">
  <option>Happy</option>
  <option>Sad</option>
  <option>Energetic</option>
  <option>Chill</option>
  <option>Dark</option>
  <option>Hopeful</option>
</select>

<label>Vocal Style</label>
<select id="vocal">
  <option>Male</option>
  <option>Female</option>
  <option>Soft</option>
  <option>Powerful</option>
  <option>Rap</option>
</select>

<label>Song Length</label>
<input id="duration" type="number" min="3" max="240" value="60">
<div class="small">3 seconds થી 240 seconds (4 minutes)</div>

<button class="lyricsBtn" onclick="generateLyrics()">
  ✨ Generate Lyrics
</button>

<button class="songBtn" id="songButton" onclick="generateSong()">
  🎵 Generate AI Song
</button>

<div id="status"></div>

<audio id="audioPlayer" controls></audio>

</div>

<div class="card">
<h2>Your Lyrics</h2>
<div id="lyrics" class="lyrics">
Lyrics અહીં દેખાશે...
</div>
</div>

</div>

<script>

const API_URL =
"https://beatforge-ai.m-chaudhari0554.workers.dev";

function getDuration(){
  let d = Number(document.getElementById("duration").value);

  if(!Number.isFinite(d)) d = 60;

  d = Math.max(3,Math.min(240,d));

  document.getElementById("duration").value = d;

  return d;
}

function generateLyrics(){

  const idea =
    document.getElementById("prompt").value.trim();

  const language =
    document.getElementById("language").value;

  if(!idea){
    document.getElementById("status").textContent =
      "❌ પહેલા Song Idea લખો.";
    return;
  }

  const lyrics =
`[Verse 1]

${idea}

[Chorus]

તારી યાદોમાં દિલ મારું ખોવાઈ જાય,
દરેક પળે બસ તું જ યાદ આવે.

[Verse 2]

રસ્તા ભલે અલગ હોય,
પણ દિલની વાત એક જ રહે.

[Chorus]

તારી યાદોમાં દિલ મારું ખોવાઈ જાય,
દરેક પળે બસ તું જ યાદ આવે.

[Outro]

આ કહાની આપણી,
હંમેશા દિલમાં જીવતી રહે.`;

  document.getElementById("lyrics").textContent = lyrics;
  document.getElementById("status").textContent =
    "✅ Lyrics generated";
}

async function generateSong(){

  const idea =
    document.getElementById("prompt").value.trim();

  if(!idea){
    document.getElementById("status").textContent =
      "❌ પહેલા Song Idea લખો.";
    return;
  }

  const language =
    document.getElementById("language").value;

  const genre =
    document.getElementById("genre").value;

  const mood =
    document.getElementById("mood").value;

  const vocal =
    document.getElementById("vocal").value;

  const duration = getDuration();

  const musicPrompt =
`Create a completely original ${language} song.

Idea:
${idea}

Genre: ${genre}
Mood: ${mood}
Vocal style: ${vocal}

Make the song completely original.
Do not imitate any existing artist or copyrighted song.
Create original music and vocals.`;

  const button =
    document.getElementById("songButton");

  const status =
    document.getElementById("status");

  const player =
    document.getElementById("audioPlayer");

  button.disabled = true;
  status.textContent =
    "🎵 Generating song... Please wait.";

  try{

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prompt:musicPrompt,
        duration:duration
      })
    });

    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(errorText);
    }

    const blob =
      await response.blob();

    const audioURL =
      URL.createObjectURL(blob);

    player.src = audioURL;
    player.play().catch(()=>{});

    status.textContent =
      "✅ Song generated successfully!";

  }catch(error){

    status.textContent =
      "❌ Song generation failed:\n" +
      error.message;

  }finally{

    button.disabled = false;

  }
}

</script>

</body>
</html>
