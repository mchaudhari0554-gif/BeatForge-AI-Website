<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatForge AI - Song Generator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080810;
    color:white;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid #222;
    background:#0d0d18;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#9b5cff;
}

.subtitle{
    color:#aaa;
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#11111d;
    border:1px solid #252535;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
}

label{
    display:block;
    color:#bbb;
    margin:12px 0 7px;
}

input,select,textarea{
    width:100%;
    background:#080810;
    color:white;
    border:1px solid #333348;
    border-radius:10px;
    padding:13px;
    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    color:white;
    background:#7b3ff2;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#252538;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

#lyricsBox{
    white-space:pre-wrap;
    line-height:1.7;
    color:#ddd;
    background:#080810;
    padding:18px;
    border-radius:12px;
    min-height:220px;
}

.status{
    color:#aaa;
    margin-top:12px;
    font-size:14px;
}

audio{
    width:100%;
    margin-top:15px;
}

.badge{
    display:inline-block;
    background:#241541;
    color:#cdaaff;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:12px;
}

footer{
    text-align:center;
    color:#777;
    padding:30px;
    font-size:13px;
}

@media(max-width:650px){
    .row{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    .card{
        padding:16px;
    }

    .logo{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎵 BeatForge <span>AI</span></div>
    <div class="subtitle">Create your own original songs</div>
</header>

<div class="container">

<div class="card">

    <div class="badge">SONG GENERATOR</div>

    <h2>Create Your Song</h2>

    <label>Song idea</label>

    <textarea
        id="prompt"
        placeholder="Example: A motivational song about never giving up..."
    ></textarea>

    <div class="row">

        <div>
            <label>Language</label>

            <select id="language">
                <option value="Hindi">Hindi</option>
                <option value="Gujarati">Gujarati</option>
                <option value="Punjabi">Punjabi</option>
                <option value="English">English</option>
            </select>
        </div>

        <div>
            <label>Genre</label>

            <select id="genre">
                <option>Pop</option>
                <option>Hip Hop</option>
                <option>Lo-fi</option>
                <option>Rock</option>
                <option>Romantic</option>
                <option>Motivational</option>
                <option>Electronic</option>
            </select>
        </div>

    </div>

    <div class="row">

        <div>
            <label>Mood</label>

            <select id="mood">
                <option>Happy</option>
                <option>Sad</option>
                <option>Energetic</option>
                <option>Chill</option>
                <option>Dark</option>
                <option>Hopeful</option>
            </select>
        </div>

        <div>
            <label>Vocal Style</label>

            <select id="vocal">
                <option>Male</option>
                <option>Female</option>
                <option>Soft</option>
                <option>Powerful</option>
                <option>Rap</option>
            </select>
        </div>

    </div>

    <label>Song Length</label>

    <select id="duration">
        <option value="60">1 Minute</option>
        <option value="120">2 Minutes</option>
        <option value="180">3 Minutes</option>
        <option value="240">4 Minutes</option>
    </select>

    <div class="buttons">

        <button onclick="generateLyrics()">
            ✨ Generate Lyrics
        </button>

        <button
            class="secondary"
            onclick="generateSong()"
        >
            🎵 Generate AI Song
        </button>

    </div>

    <div id="status" class="status"></div>

</div>


<div class="card">

    <div class="badge">LYRICS</div>

    <h2>Your Lyrics</h2>

    <div id="lyricsBox">
Your generated lyrics will appear here...
    </div>

    <div class="buttons">

        <button onclick="downloadLyrics()">
            ⬇️ Download Lyrics
        </button>

    </div>

</div>


<div class="card">

    <div class="badge">AI AUDIO</div>

    <h2>Song Preview</h2>

    <audio
        id="audioPlayer"
        controls
    ></audio>

    <div class="buttons">

        <button onclick="downloadAudio()">
            ⬇️ Download AI Song
        </button>

    </div>

    <div class="status">
        AI music is generated through the secure BeatForge backend.
    </div>

</div>

</div>


<footer>
BeatForge AI • Original content generator
</footer>


<script>

let currentLyrics = "";
let currentAudioURL = null;


/* -------------------------
   CLOUDFLARE WORKER
------------------------- */

const API_URL =
"https://beatforge-ai.m-chaudhari0554.workers.dev";


/* -------------------------
   LYRICS GENERATOR
------------------------- */

function generateLyrics(){

    const prompt =
        document.getElementById("prompt").value.trim();

    const language =
        document.getElementById("language").value;

    const genre =
        document.getElementById("genre").value;

    const mood =
        document.getElementById("mood").value;


    if(!prompt){

        document.getElementById("status").innerText =
        "Please enter your song idea.";

        return;
    }


    document.getElementById("status").innerText =
    "✨ Creating original lyrics...";


    setTimeout(()=>{

        currentLyrics =
            createLyrics(
                prompt,
                language,
                genre,
                mood
            );

        document.getElementById("lyricsBox").innerText =
            currentLyrics;

        document.getElementById("status").innerText =
            "✅ Lyrics generated!";

    },700);

}


/* -------------------------
   ORIGINAL LYRICS
------------------------- */

    prompt,
    language,
    genre,
    mood
){

    if(language === "Hindi"){

        return `[Verse 1]

    }


    if(language === "Gujarati"){

        return `[અંતરો 1]

હૈયામાં નવી રવાણી છે.

પણ આંખોમાં એક નિશાની છે.

[પ્રી-કોરસ]

સપનાઓને સાચા કરીશું.
આજે નહીં તો કાલે,
આકાશને પણ સ્પર્શીશું.

[કોરસ]

[અંતરો 2]

રાત પછી સવાર આવશે,
દરેક સપનું સાકાર થશે.
જે ગયું તે શીખ બની,
આગળ નવી રાહ મળશે.

[કોરસ]

આ મારી ઉડાન છે,
આ મારું આકાશ છે.
રોકાવું નથી, ઝુકાવું નથી,
હૈયામાં હજુ શ્વાસ છે.`;

    }


    if(language === "Punjabi"){

        return `[Verse 1]

${prompt} di eh kahani ae,
Dil vich navi rawani ae.
Rahan bhawein aukhiyaan hon,
Akhan vich umeed purani ae.

[Pre-Chorus]

Supne saare chunange.

    }


    return `[Verse 1]

/* -------------------------
   REAL AI SONG GENERATOR
------------------------- */

async function generateSong(){

    const idea =
        document.getElementById("prompt").value.trim();

    const language =
        document.getElementById("language").value;

    const genre =
        document.getElementById("genre").value;

    const mood =
        document.getElementById("mood").value;

    const vocal =
        document.getElementById("vocal").value;

    const duration =
        Number(
            document.getElementById("duration").value
        );


    if(!idea){

        document.getElementById("status").innerText =
            "Please enter your song idea first.";

        return;
    }


    document.getElementById("status").innerText =
        "🎵 Generating your AI song... Please wait.";


    const musicPrompt = `

Create a completely original ${language} song.

Theme:
${idea}

Genre:
${genre}

Mood:
${mood}

Vocal style:
${vocal}

Use original lyrics and an original melody.
Do not imitate any existing artist or copyrighted song.

Create a complete song with vocals, melody,
harmony, rhythm, bass and appropriate instruments.

Make the arrangement suitable for a polished modern
${genre} song.

The lyrics should primarily be in ${language}.

`;


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        prompt:musicPrompt,

                        duration:duration

                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                errorText ||
                "AI generation failed."
            );
        }


        const audioBlob =
            await response.blob();


        if(currentAudioURL){

            URL.revokeObjectURL(
                currentAudioURL
            );

        }


        currentAudioURL =
            URL.createObjectURL(
                audioBlob
            );


        const player =
            document.getElementById(
                "audioPlayer"
            );


        player.src =
            currentAudioURL;


        player.load();


        document.getElementById("status").innerText =
            "✅ AI song ready! Press Play ▶️";


    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
            "❌ Song generation failed: " +
            error.message;

    }

}


/* -------------------------
   DOWNLOAD LYRICS
------------------------- */

function downloadLyrics(){

    if(!currentLyrics){

        alert(
            "Generate lyrics first."
        );

        return;
    }


    const blob =
        new Blob(
            [currentLyrics],
            {
                type:"text/plain"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        "BeatForge-AI-Lyrics.txt";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

}


/* -------------------------
   DOWNLOAD AI SONG
------------------------- */

function downloadAudio(){

    if(!currentAudioURL){

        alert(
            "Generate an AI song first."
        );

        return;
    }


    const a =
        document.createElement("a");


    a.href =
        currentAudioURL;


    a.download =
        "BeatForge-AI-Song.mp3";


    document.body.appendChild(a);

    a.click();

    a.remove();

}

</script>

</body>
</html>
